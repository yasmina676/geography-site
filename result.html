<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Результат тестирования</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:
    linear-gradient(
        rgba(0,0,0,0.85),
        rgba(0,0,0,0.85)
    ),
    url("фон.jpg");

    background-size:cover;
    background-position:center;
    background-attachment:fixed;

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    color:white;
}

.result-card{
    width:650px;
    max-width:90%;

    background:rgba(220,220,220,0.25);

    backdrop-filter:blur(10px);

    border:3px solid #2e7d32;

    border-radius:35px;

    padding:40px;

    text-align:center;

    transition:0.4s;
}

.result-card:hover{
    border-color:#4caf50;

    box-shadow:
        0 0 20px #4caf50,
        0 0 40px rgba(76,175,80,0.6);
}

h1{
    color:white;

    font-size:40px;

    margin-bottom:25px;

    text-shadow:
        0 0 10px rgba(255,255,255,0.8),
        0 0 20px rgba(255,255,255,0.4);
}

.result{
    font-size:42px;

    font-weight:bold;

    margin:30px 0;

    color:white;
}

.message{
    font-size:22px;

    color:#e0e0e0;

    margin-bottom:30px;
}

.btn{
    display:inline-block;

    padding:15px 35px;

    text-decoration:none;

    color:white;

    background:rgba(255,255,255,0.15);

    border-left:5px solid #22730c;

    border-radius:15px;

    font-size:22px;

    font-weight:bold;

    transition:0.3s;
}

.btn:hover{
    background:white;
    color:black;

    transform:scale(1.03);
}

</style>
</head>

<body>

<div class="result-card">

<h1>Результат тестирования</h1>

<div class="result" id="result"></div>

<div class="message" id="message"></div>

<a href="menu (2).html" class="btn">
Вернуться в меню
</a>

</div>

<script>

let percent = localStorage.getItem("testPercent") || 0;
let score = localStorage.getItem("testScore") || 0;

document.getElementById("result").innerHTML =
percent + "% (" + score + " из 30)";

let text = "";

if(percent >= 90){
    text = "Отличный результат!";
}
else if(percent >= 75){
    text = "Хороший результат!";
}
else if(percent >= 50){
    text = "Удовлетворительный результат.";
}
else{
    text = "Рекомендуется повторить теорию.";
}

document.getElementById("message").innerHTML = text;

</script>

</body>
</html>
